version: '3.8'

services:
  nlrk-reader-workstation-api:
    container_name: nlrk-reader-workstation-api
    image: shaisarov/nlrk-reader-workstation-api
    restart: unless-stopped
    build:
      context: .
      args:
        - http_proxy
        - https_proxy
        - no_proxy
    ports:
      - "8594:8594"
    environment:
      - LISTEN=:8594
      - READER_GRPC_ADDRESS=nlrk-reader:8906
      - ORDER_GRPC_ADDRESS=nlrk-reader:8909
      - EBOOK_GRPC_ADDRESS=nlrk-reader:8911
      - SSO_GRPC_ADDRESS=nlrk-reader:8908
      - BASE_PATH=/
      - DEBUG=1
    networks:
      - web_rabis_network
networks:
  web_rabis_network:
    external: true
