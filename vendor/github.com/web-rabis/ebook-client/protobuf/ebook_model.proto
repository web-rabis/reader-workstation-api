syntax = "proto3";
package ebook;
option go_package = "./protobuf;protobuf";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "protobuf/dictionary_model.proto";
message Ebook {
  int64 id = 1;
  int64 parent_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  State state = 5;
  BibliographicLevel bibliographic_level = 6;
  TypeDescription type_description = 7;
  bool krv = 8;
  int64 volume_number = 9;
  Catalog catalog = 10;
  string author = 11;
  string title = 12;
  repeated Source sources = 13;
  repeated ServiceNote service_notes = 14;
  AuthorMark author_mark = 15;
  repeated Inv inv = 16;
  repeated Text texts = 17;
  repeated Sigla siglas = 18;
  EbookCard card = 19;
  repeated Publishing publishings = 20;
  Language language = 21;
  // r_cipher - полочный шифр; вычисляется на сервере
  // (ebook.Ebook.CalcRCipher), в БД не хранится.
  string r_cipher = 22;
  Volume volume = 23;
}
message EbookCard{
    int64 volume_number = 1;
    string author = 2;
    string title = 3;
    string r_avt = 4;
    string main = 5;
    string r_cipher = 6;
    AuthorMark author_mark = 7;
    Language language = 8;
    repeated string indexes = 9;
    repeated Inv inv = 10;
}
message AuthorMark {
  string author_mark = 1;
}
message ServiceNote {
  int64 id = 1;
  int64 ebook_id = 2;
  DictionaryServiceData service_data = 3;
}
message Inv {
  int64 id = 1;
  int64 ebook_id = 2;
  string inv_number = 3;
  string barcode = 4;
  Department department = 5;
  State state = 6;
}
message Source {
  int64 id = 1;
  int64 ebook_id = 2;
  string title = 3;
  string data = 4;
  string responsibility = 5;
  string authors = 6;
  string data_edition = 7;
  string data_out = 8;
  string special_character = 9;
  string composite_information = 10;
  string series = 11;
  string isbn = 12;
  string issn = 13;
  string parallel_name = 14;
  string year = 15;
  string pages = 16;
}
message Language {
  int64 id = 1;
  int64 ebook_id = 2;
  DictionaryLanguage language = 3;
  string source_rewrite = 4;
}
message Text  {
  int64 id = 1;
  int64 ebook_id = 2;
  string text = 3;
  string note = 4;
  string url = 5;
}
message Sigla {
  int64 id = 1;
  int64 ebook_id = 2;
  DictionarySigla sigla = 3;
}
message Author {
  int64 id = 1;
  int64 ebook_id = 2;
  string author = 3;
  int64 ne_razdel = 4;
}
message ParallelTitle {
  int64 id = 1;
  int64 ebook_id = 2;
  int64 title_id = 3;
  string parallel_name = 4;
}
message Title {
  int64 id = 1;
  int64 ebook_id = 2;
  string title = 3;
  repeated ParallelTitle parallel_titles = 4;
  string data_responsibility = 5;
  string data_title = 6;
  string part_number = 7;
  string part_name = 8;
  Author author = 9;
}
message Publishing {
  int64 id = 1;
  int64 ebook_id = 2;
  DictionaryCity place_edition = 3;
  DictionaryPublishing publishing = 4;
  string year_edition = 5;
}
message Volume {
  int64 id = 1;
  int64 ebook_id = 2;
  string volume = 3;
  string physic_character = 4;
  string size  = 5;
  string supporting_material = 6;
  string type_unit = 7;
  string size_unit = 8;
  string specification_material = 9;
}
message Paging {
  int64   offset = 1;
  int64   limit = 2;
  string  sortKey = 3;
  int32   sortVal = 4;
}
message InvFilters {
  int64 ebook_id = 1;
}
message EbookFilters {
  repeated string statuses = 1;
  repeated int64 status_ids = 2;
  google.protobuf.Timestamp created_at_low = 3;
  google.protobuf.Timestamp created_at_high = 4;
  google.protobuf.Timestamp updated_at_low = 5;
  google.protobuf.Timestamp updated_at_high = 6;
  int64 catalog_id = 7;
  int64 bibliographic_level_id = 8;
  int64 type_description_id = 9;
}

message EbookForm {
  int64 id = 1;
  optional int64 parent_id = 2;  // нет у записи верхнего уровня (без родителя)
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  State state = 5;
  BibliographicLevel bibliographic_level = 6;
  TypeDescription type_description = 7;
  bool krv = 8;
  int64 volume_number = 9;
  Catalog catalog = 10;
  repeated EbookFormBlock blocks = 11;
}
message DictionaryRef {
  int64 id = 1;
  string code = 2;  // на запись игнорируется
  string name = 3;  // на запись игнорируется
}

message EbookFormBlock {
  optional int64 id = 1;        // нет у несохранённого повтора
  optional int64 ebook_id = 2;  // нет при создании
  int64 block_id = 3;
  repeated EbookFormBlockField values = 4;
  bool deleted = 5;  // повтор с external_table нужно удалить; для блока без external_table игнорируется
}
message EbookFormBlockField {
  int64 field_id = 1;
  oneof value {
    google.protobuf.NullValue null_value  = 2;  // явно, см. ниже
    string                    string_value = 3;
    int64                     int_value    = 4;
    bool                      bool_value   = 5;
    DictionaryRef             dictionary_value = 6;
  }
}